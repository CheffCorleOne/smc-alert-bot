name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        # MetaTrader5 is Windows-only and not importable here, but the SMC
        # engine imports it lazily, so the pure-logic tests run on Linux CI.
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pytest pytest-cov ruff mypy

      - name: Lint (ruff)
        run: ruff check core utils tests || true   # advisory until legacy lint is cleared

      - name: Test (pytest)
        run: pytest --cov=core --cov-report=term-missing
